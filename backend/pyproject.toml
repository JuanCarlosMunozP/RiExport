[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "riexport-api"
version = "0.1.0"
description = "API para la plataforma RiExport"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<2",
    "bcrypt>=5,<6",
    "email-validator>=2.3.0",
    "fastapi>=0.141,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.15,<3",
    "PyJWT>=2.15,<3",
    "SQLAlchemy>=2.1,<3",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*", "core*", "database*", "integrations*",
    "audit*", "auth*", "customers*", "documents*", "exports*",
    "farms*", "inventory*", "jobs*", "logistics*", "notifications*",
    "orders*", "payments*", "products*", "reports*", "roles*",
    "suppliers*", "users*", "scripts*",
]
